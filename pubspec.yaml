name: ai_image_diary
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  # --- アイコン ---
  cupertino_icons: ^1.0.8

  # --- Amplify (AWS) 関連 ---
  # バージョンを ^2.0.0 に統一して、互換性のある最新版を自動取得させます
  amplify_flutter: ^2.0.0
  amplify_auth_cognito: ^2.0.0
  amplify_api: ^2.0.0
  amplify_datastore: ^2.0.0
  amplify_storage_s3: ^2.0.0
  amplify_authenticator: ^2.0.0

  # --- その他 ---
  flutter_dotenv: ^5.2.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # .envを読み込む設定
  assets:
    - .env